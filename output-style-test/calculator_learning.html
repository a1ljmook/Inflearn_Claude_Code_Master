<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Calculator — 웹 개발 학습용 계산기</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --calc-bg: #ffffff;
            --display-bg: #2d3436;
            --display-text: #dfe6e9;
            --btn-bg: #f1f2f6;
            --btn-text: #2d3436;
            --btn-accent: #0984e3;
            --btn-accent-text: #ffffff;
            --btn-danger: #ff7675;
            --btn-danger-text: #ffffff;
            --shadow: 0 10px 25px rgba(0,0,0,0.1);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .calculator {
            background-color: var(--calc-bg);
            width: 320px;
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        /* 디스플레이 영역 */
        .display {
            background-color: var(--display-bg);
            color: var(--display-text);
            text-align: right;
            padding: 20px;
            font-size: 2rem;
            border-radius: var(--radius);
            margin-bottom: 20px;
            min-height: 80px;
            word-wrap: break-word;
            word-break: break-all;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
        }

        /* 버튼 그리드 레이아웃 */
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            padding: 20px;
            font-size: 1.2rem;
            font-weight: 600;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: var(--btn-bg);
            color: var(--btn-text);
        }

        button:hover {
            filter: brightness(0.9);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        /* 특수 버튼 스타일 */
        .operator {
            background-color: #dfe6e9;
            color: var(--btn-accent);
        }

        .equals {
            background-color: var(--btn-accent);
            color: var(--btn-accent-text);
            grid-column: span 2; /* 두 칸 차지 */
        }

        .clear {
            background-color: var(--btn-danger);
            color: var(--btn-danger-text);
        }
    </style>
</head>
<body>

    <div class="calculator">
        <div class="display" id="display">0</div>
        <div class="buttons" id="button-grid">
            <!-- 첫 번째 줄 -->
            <button class="clear">C</button>
            <button class="operator">+/-</button>
            <button class="operator">%</button>
            <button class="operator" data-val="/">÷</button>

            <!-- 숫자 및 연산자 -->
            <button data-val="7">7</button>
            <button data-val="8">8</button>
            <button data-val="9">9</button>
            <button class="operator" data-val="*">×</button>

            <button data-val="4">4</button>
            <button data-val="5">5</button>
            <button data-val="6">6</button>
            <button class="operator" data-val="-">−</button>

            <button data-val="1">1</button>
            <button data-val="2">2</button>
            <button data-val="3">3</button>
            <button class="operator" data-val="+">+</button>

            <button data-val="0" style="grid-column: span 2;">0</button>
            <button data-val=".">.</button>
            <button class="equals">=</button>
        </div>
    </div>

    <script>
        const displayElement = document.getElementById('display');
        const buttonGrid = document.getElementById('button-grid');

        let currentInput = '0'; // 현재 입력 중인 값
        let pendingValue = null; // 이전 계산 값
        let operator = null;     // 선택된 연산자
        let shouldResetScreen = false; // 다음 입력 시 화면을 초기화할지 여부

        // 버튼 클릭 이벤트 처리 (이벤트 위임 방식)
        buttonGrid.addEventListener('click', (e) => {
            if (!e.target.matches('button')) return;

            const btn = e.target;
            const val = btn.getAttribute('data-val');

            if (btn.classList.contains('clear')) {
                handleClear();
            } else if (btn.classList.contains('equals')) {
                handleEquals();
            } else if (btn.classList.contains('operator') && !val) {
                // +/- 또는 % 처리 (여기서는 학습을 위해 단순하게 구성)
                handleSpecialOperator(btn.innerText);
            } else if (val && btn.classList.contains('operator')) {
                handleOperator(val);
            } else if (val) {
                handleNumber(val);
            }

            updateDisplay();
        });

        function handleNumber(num) {
            if (currentInput === '0' || shouldResetScreen) {
                currentInput = num;
                shouldResetScreen = false;
            } else {
                currentInput += num;
            }
        }

        function handleOperator(op) {
            if (operator !== null) handleEquals(); // 이미 연산자가 있다면 먼저 계산

            pendingValue = parseFloat(currentInput);
            operator = op;
            shouldResetScreen = true;
        }

        function handleEquals() {
            if (operator === null || pendingValue === null) return;

            const secondValue = parseFloat(currentInput);
            let result = 0;

            switch (operator) {
                case '+': result = pendingValue + secondValue; break;
                case '-': result = pendingValue - secondValue; break;
                case '*': result = pendingValue * secondValue; break;
                case '/': result = pendingValue / secondValue; break;
            }

            currentInput = result.toString();
            operator = null;
            pendingValue = null;
            shouldResetScreen = true;
        }

        function handleClear() {
            currentInput = '0';
            pendingValue = null;
            operator = null;
            shouldResetScreen = false;
        }

        function handleSpecialOperator(type) {
            if (type === '+/-') {
                currentInput = (parseFloat(currentInput) * -1).toString();
            } else if (type === '%') {
                currentInput = (parseFloat(currentInput) / 100).toString();
            }
        }

        function updateDisplay() {
            displayElement.innerText = currentInput;
        }
    </script>
</body>
</html>
