<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>05 TIP 03 · 토큰 관리</title>
<link rel="stylesheet" href="../../styles/card.css">
<style>
  .tip-title { margin-bottom: 44px; }
  .token-compare {
    display: flex;
    flex-direction: column;
    gap: 20px;
    margin-bottom: 40px;
  }
  .token-row {
    padding: 28px 32px;
    border-radius: 18px;
    border: 1px solid var(--card-border);
    background: var(--bg-elevated);
    position: relative;
  }
  .token-row.good { background: var(--good-bg); border-color: var(--good-border); }
  .token-row.bad { background: var(--bad-bg); border-color: var(--bad-border); }
  .token-row-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .token-label {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: #E5E5E5;
  }
  .token-multi {
    font-size: 36px;
    font-weight: 800;
    letter-spacing: -0.02em;
    font-feature-settings: "tnum";
  }
  .token-row.good .token-multi { color: var(--good-text); }
  .token-row.bad .token-multi { color: #FF8A5C; }
  .bar {
    width: 100%;
    height: 14px;
    background: rgba(255,255,255,0.05);
    border-radius: 999px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 999px;
  }
  .bar-fill.good {
    width: 74%;
    background: linear-gradient(90deg, #4ADE80, #22C55E);
  }
  .bar-fill.bad {
    width: 100%;
    background: linear-gradient(90deg, #FF8A5C, #FF6B35);
  }

  .controls {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
  .ctrl {
    padding: 24px 18px;
    border-radius: 16px;
    border: 1px solid var(--accent-border);
    background: var(--accent-bg);
    text-align: center;
  }
  .ctrl .num {
    display: inline-block;
    font-size: 18px;
    font-weight: 800;
    color: var(--accent);
    margin-bottom: 10px;
    letter-spacing: 0.1em;
  }
  .ctrl .name {
    font-size: 24px;
    font-weight: 700;
    color: #fff;
    letter-spacing: -0.01em;
    line-height: 1.25;
  }
  .ctrl .sub {
    font-size: 18px;
    font-weight: 500;
    color: var(--text-secondary);
    margin-top: 6px;
    line-height: 1.35;
  }
</style>
</head>
<body>
<div class="card">
  <header class="card-header">
    <div class="card-header-left">
      <img src="../../logo.svg" class="logo" alt="짐코딩">
      <span class="label">클로드 코드 완벽 마스터</span>
    </div>
    <div class="card-header-right">#opus4.7 best practice</div>
  </header>

  <div class="page-number">05</div>

  <section class="card-body">
    <div class="eyebrow">TIP 03</div>
    <h2 class="title-xl tip-title">
      토큰은 <span class="accent">1.0 ~ 1.35배</span><br>
      늘어납니다
    </h2>

    <div class="token-compare">
      <div class="token-row good">
        <div class="token-row-head">
          <div class="token-label">Opus 4.6</div>
          <div class="token-multi">1.0×</div>
        </div>
        <div class="bar"><div class="bar-fill good"></div></div>
      </div>
      <div class="token-row bad">
        <div class="token-row-head">
          <div class="token-label">Opus 4.7 (토크나이저 업데이트)</div>
          <div class="token-multi">최대 1.35×</div>
        </div>
        <div class="bar"><div class="bar-fill bad"></div></div>
      </div>
    </div>

    <div class="controls">
      <div class="ctrl">
        <div class="num">01</div>
        <div class="name">effort 조정</div>
        <div class="sub">파라미터로 직접 제어</div>
      </div>
      <div class="ctrl">
        <div class="num">02</div>
        <div class="name">Task budgets</div>
        <div class="sub">public beta · 작업 단위</div>
      </div>
      <div class="ctrl">
        <div class="num">03</div>
        <div class="name">"간결하게" 지시</div>
        <div class="sub">프롬프트로 응답 축소</div>
      </div>
    </div>

    <div class="bottom-banner">
      Task Budgets 베타로 토큰 지출을 통제하세요
    </div>
  </section>
</div>
</body>
</html>
