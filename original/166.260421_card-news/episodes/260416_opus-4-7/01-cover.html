<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>01 Cover · Opus 4.7</title>
<link rel="stylesheet" href="../../styles/card.css">
<style>
  .cover-hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
  }
  .cover-mark {
    position: absolute;
    top: -30px;
    right: -20px;
    font-size: 360px;
    font-weight: 900;
    line-height: 0.9;
    letter-spacing: -0.08em;
    color: rgba(255, 107, 53, 0.08);
    font-feature-settings: "tnum";
    user-select: none;
  }
  .cover-badge {
    align-self: flex-start;
    margin-bottom: 48px;
  }
  .cover-title {
    font-size: 100px;
    font-weight: 800;
    line-height: 1.04;
    letter-spacing: -0.04em;
  }
  .cover-title .line-2 { display: block; }
  .cover-sub {
    font-size: 34px;
    font-weight: 500;
    color: var(--text-secondary);
    margin-top: 36px;
    line-height: 1.4;
    letter-spacing: -0.01em;
  }
  .cover-meta {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-top: 56px;
    font-size: 22px;
    color: var(--text-tertiary);
    letter-spacing: 0.01em;
  }
  .cover-meta code {
    font-family: 'SF Mono', ui-monospace, Menlo, monospace;
    padding: 6px 12px;
    background: var(--bg-elevated);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    color: #D4D4D4;
    font-size: 20px;
  }
  .cover-meta .dot { color: rgba(255,255,255,0.2); }
</style>
</head>
<body>
<div class="card">
  <header class="card-header">
    <div class="card-header-left">
      <img src="../../logo.svg" class="logo" alt="짐코딩">
      <span class="label">클로드 코드 완벽 마스터</span>
    </div>
    <div class="card-header-right">#opus4.7 best practice</div>
  </header>

  <div class="page-number">01</div>

  <section class="cover-hero">
    <div class="cover-mark">4.7</div>
    <div class="cover-badge"><span class="badge">OPUS 4.7 공개</span></div>
    <h1 class="cover-title">
      Claude Opus 4.7,
      <span class="line-2">쓰는 법이 <span class="accent">달라졌습니다</span></span>
    </h1>
    <p class="cover-sub">2026.04.16 출시 · 베스트 프랙티스 5가지</p>

    <div class="cover-meta">
      <code>claude-opus-4-7</code>
      <span class="dot">·</span>
      <span>API</span>
      <span class="dot">·</span>
      <span>Bedrock</span>
      <span class="dot">·</span>
      <span>Vertex AI</span>
      <span class="dot">·</span>
      <span>Foundry</span>
    </div>
  </section>
</div>
</body>
</html>
