<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>07 벤치마크 숫자</title>
<link rel="stylesheet" href="../../styles/card.css">
<style>
  .bench-title { margin-bottom: 52px; }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  .cell {
    padding: 36px 32px;
    border-radius: 22px;
    border: 1px solid var(--card-border);
    background: var(--bg-elevated);
    min-height: 260px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .cell .org {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--text-secondary);
    text-transform: uppercase;
  }
  .cell .big {
    font-size: 76px;
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1;
    color: var(--accent);
    font-feature-settings: "tnum";
    margin: 14px 0 6px;
  }
  .cell .vs {
    font-size: 20px;
    font-weight: 600;
    color: var(--text-tertiary);
    font-feature-settings: "tnum";
  }
  .cell .desc {
    font-size: 22px;
    font-weight: 600;
    color: #D4D4D4;
    line-height: 1.4;
    letter-spacing: -0.01em;
    margin-top: 8px;
  }
  .cell.accent-cell {
    background: var(--accent-bg);
    border-color: var(--accent-border);
  }
</style>
</head>
<body>
<div class="card">
  <header class="card-header">
    <div class="card-header-left">
      <img src="../../logo.svg" class="logo" alt="짐코딩">
      <span class="label">클로드 코드 완벽 마스터</span>
    </div>
    <div class="card-header-right">#opus4.7 best practice</div>
  </header>

  <div class="page-number">07</div>

  <section class="card-body">
    <div class="eyebrow">NUMBERS</div>
    <h2 class="title-xl bench-title">
      어려운 과제에서<br>
      가장 크게 <span class="accent">점프</span>했다
    </h2>

    <div class="grid">
      <div class="cell accent-cell">
        <div class="org">Cursor</div>
        <div>
          <div class="big">70%</div>
          <div class="vs">vs Opus 4.6 — 58%</div>
        </div>
        <div class="desc">CursorBench 통과율</div>
      </div>
      <div class="cell accent-cell">
        <div class="org">XBOW</div>
        <div>
          <div class="big">98.5%</div>
          <div class="vs">vs Opus 4.6 — 54.5%</div>
        </div>
        <div class="desc">visual-acuity 벤치</div>
      </div>
      <div class="cell">
        <div class="org">Rakuten</div>
        <div>
          <div class="big">3×</div>
          <div class="vs">vs Opus 4.6</div>
        </div>
        <div class="desc">프로덕션 과제 해결</div>
      </div>
      <div class="cell">
        <div class="org">Notion</div>
        <div>
          <div class="big">+14%</div>
          <div class="vs">토큰 ↓ · 툴 에러 1/3</div>
        </div>
        <div class="desc">다단계 워크플로 정확도</div>
      </div>
    </div>

    <div class="bottom-banner">
      현업 테스터 28명이 공통 평가 — Opus 4.6을 전방위 상회
    </div>
  </section>
</div>
</body>
</html>
