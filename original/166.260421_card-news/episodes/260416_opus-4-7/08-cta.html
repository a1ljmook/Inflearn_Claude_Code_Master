<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>08 CTA · 팔로우 & 강의</title>
<link rel="stylesheet" href="../../styles/card.css">
<style>
  .cta-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding-top: 0;
  }
  .cta-title {
    font-size: 88px;
    font-weight: 800;
    line-height: 1.12;
    letter-spacing: -0.035em;
  }
  .cta-sub {
    font-size: 32px;
    font-weight: 500;
    color: var(--text-secondary);
    margin-top: 36px;
    line-height: 1.5;
    letter-spacing: -0.01em;
  }
  .follow-btn {
    margin-top: 72px;
    display: inline-block;
    padding: 28px 72px;
    background: var(--accent);
    color: #fff;
    border-radius: 16px;
    font-size: 34px;
    font-weight: 800;
    letter-spacing: -0.01em;
    box-shadow: 0 14px 40px rgba(255, 107, 53, 0.25);
  }
  .course-banner {
    margin-top: 96px;
    width: 100%;
    padding: 30px 28px;
    text-align: center;
    background: var(--accent-bg);
    border: 1px solid var(--accent-border);
    border-radius: 20px;
    color: var(--accent);
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
</style>
</head>
<body>
<div class="card">
  <header class="card-header">
    <div class="card-header-left">
      <img src="../../logo.svg" class="logo" alt="짐코딩">
      <span class="label">클로드 코드 완벽 마스터</span>
    </div>
    <div class="card-header-right">#opus4.7 best practice</div>
  </header>

  <div class="page-number">08</div>

  <section class="cta-body">
    <h2 class="cta-title">
      <span class="accent">AI 코딩 최신 흐름,</span><br>
      놓치지 마세요
    </h2>
    <p class="cta-sub">
      저장하고 팔로우해두면<br>
      새로운 소식을 가장 빠르게 받아볼 수 있어요
    </p>

    <a class="follow-btn">짐코딩 팔로우</a>

    <div class="course-banner">
      클로드 코드 완벽 마스터 · 15% 할인 중
    </div>
  </section>
</div>
</body>
</html>
