<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>02 Hook · 컨텍스트 로트</title>
<link rel="stylesheet" href="../../styles/card.css">
<style>
  .hook-title { margin-bottom: 52px; }
  .num-list { margin-top: 0; }
</style>
</head>
<body>
<div class="card">
  <header class="card-header">
    <div class="card-header-left">
      <img src="../../logo.svg" class="logo" alt="짐코딩">
      <span class="label">클로드 코드 완벽 마스터</span>
    </div>
    <div class="card-header-right">#claude-code #session</div>
  </header>

  <div class="page-number">02</div>

  <section class="card-body">
    <div class="eyebrow">PROBLEM</div>
    <h2 class="title-xl hook-title">
      Claude Code 세션,<br>
      이렇게 쓰고 있나요?
    </h2>

    <div class="num-list">
      <div class="num-card v1">
        <div class="num">1</div>
        <div class="body">
          <div class="t1">한 세션으로 끝까지 밀어붙인다</div>
          <div class="t2">컨텍스트가 커질수록 모델이 점점 헤맵니다</div>
        </div>
      </div>
      <div class="num-card v2">
        <div class="num">2</div>
        <div class="body">
          <div class="t1">자동 컴팩션에만 맡긴다</div>
          <div class="t2">모델이 가장 혼란스러울 때 요약돼 손실 발생</div>
        </div>
      </div>
      <div class="num-card v3">
        <div class="num">3</div>
        <div class="body">
          <div class="t1">실수는 수정 메시지로 덮는다</div>
          <div class="t2">실패한 시도가 컨텍스트를 계속 오염시킵니다</div>
        </div>
      </div>
    </div>

    <div class="bottom-banner">
      1M 컨텍스트, 크다고 무조건 좋은 게 아닙니다
    </div>
  </section>
</div>
</body>
</html>
