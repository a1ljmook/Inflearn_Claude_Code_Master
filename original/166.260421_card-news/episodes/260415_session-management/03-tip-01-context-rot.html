<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>03 TIP 01 · 컨텍스트 로트</title>
<link rel="stylesheet" href="../../styles/card.css">
<style>
  .tip-title { margin-bottom: 48px; }
  .compare {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px;
    margin-top: 4px;
  }
  .compare .box { min-height: 420px; display: flex; flex-direction: column; }
  .box-bad .content {
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 1;
    font-size: 30px;
    color: var(--bad-text);
    font-weight: 600;
    text-align: center;
    line-height: 1.35;
  }
  .kv-list { margin-top: 4px; display: flex; flex-direction: column; gap: 18px; }
  .kv { display: flex; gap: 16px; align-items: baseline; }
  .kv .k {
    font-size: 26px;
    font-weight: 800;
    color: var(--good-text);
    min-width: 72px;
  }
  .kv .v {
    font-size: 26px;
    font-weight: 500;
    color: #E5E5E5;
    letter-spacing: -0.01em;
  }
</style>
</head>
<body>
<div class="card">
  <header class="card-header">
    <div class="card-header-left">
      <img src="../../logo.svg" class="logo" alt="짐코딩">
      <span class="label">클로드 코드 완벽 마스터</span>
    </div>
    <div class="card-header-right">#claude-code #session</div>
  </header>

  <div class="page-number">03</div>

  <section class="card-body">
    <div class="eyebrow">TIP 01</div>
    <h2 class="title-xl tip-title">
      컨텍스트가 커지면<br>
      성능은 <span class="accent">떨어집니다</span>
    </h2>

    <div class="compare">
      <div class="box box-bad">
        <span class="tag">BAD</span>
        <div class="content">"한 세션을 1M까지<br>꽉 채워 쓴다"</div>
      </div>
      <div class="box box-good">
        <span class="tag">GOOD</span>
        <div class="kv-list">
          <div class="kv"><span class="k">증상</span><span class="v">주의력이 분산</span></div>
          <div class="kv"><span class="k">원인</span><span class="v">오래된 내용이 노이즈</span></div>
          <div class="kv"><span class="k">특징</span><span class="v">1M 크기도 무력</span></div>
          <div class="kv"><span class="k">해법</span><span class="v">적극적 세션 분할</span></div>
        </div>
      </div>
    </div>

    <div class="bottom-banner">
      Context Rot — 크기보다 '신선도'가 성능을 만듭니다
    </div>
  </section>
</div>
</body>
</html>
