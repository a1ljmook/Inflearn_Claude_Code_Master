<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>섹션 5: 마무리 — 하네스 엔지니어링</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
    <style>
        :root {
            --bg: #000000;
            --text: #FFFFFF;
            --text-sub: #D5D5D5;
            --text-dim: #AAAAAA;
            --accent: #FFD100;
            --accent-dim: rgba(255, 209, 0, 0.12);
            --surface: #161616;
            --border: #333333;
            --font-main: 'Pretendard Variable', 'Pretendard', -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --title: clamp(3.2rem, 10vw, 8rem);
            --h2: clamp(2.5rem, 6.5vw, 5rem);
            --h3: clamp(1.4rem, 3vw, 3rem);
            --body: clamp(1.25rem, 2.5vw, 2.2rem);
            --small: clamp(1.15rem, 2vw, 2rem);
            --label: clamp(1.3rem, 2.5vw, 1.7rem);
            --mono: clamp(1.15rem, 2vw, 1.8rem);
            --pad: clamp(2rem, 5vw, 6rem);
            --gap: clamp(1.2rem, 3vw, 3rem);
        }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-snap-type: y mandatory; scroll-behavior: smooth; height: 100%; overflow-x: hidden; scrollbar-width: none; -ms-overflow-style: none; }
        html::-webkit-scrollbar { display: none; }
        *, *:focus, *:focus-visible, *:focus-within { outline: 0 !important; box-shadow: none !important; }
        body { font-family: var(--font-main); background: var(--bg); color: var(--text); height: 100%; overflow-x: hidden; -webkit-font-smoothing: antialiased; font-weight: 500; }

        .slide {
            width: 100vw; height: 100vh; height: 100dvh;
            overflow: hidden; scroll-snap-align: start;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: var(--pad); position: relative; text-align: center;
            contain: layout style paint;
        }
        .slide-content {
            flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
            max-height: 100%; overflow: hidden; max-width: 1100px; width: 100%;
        }

        .mega { font-size: var(--title); font-weight: 900; line-height: 1.05; letter-spacing: -0.03em; }
        h2 { font-size: var(--h2); font-weight: 800; line-height: 1.15; letter-spacing: -0.02em; }
        h3 { font-size: var(--h3); font-weight: 700; line-height: 1.25; }
        p, li { font-size: var(--body); line-height: 1.65; font-weight: 400; }
        .accent { color: var(--accent); }
        .sub { color: var(--text-sub); }
        .label { font-family: var(--font-mono); font-size: var(--label); letter-spacing: 0.03em; color: var(--accent); text-transform: uppercase; font-weight: 800; }

        .num-big { font-size: clamp(3.5rem, 10vw, 8rem); font-weight: 900; line-height: 1; letter-spacing: -0.03em; }
        .num-label { font-size: var(--body); color: var(--text-sub); margin-top: 0.6em; font-weight: 500; }
        .comparison { display: flex; justify-content: center; align-items: center; gap: clamp(2rem, 5vw, 4rem); width: 100%; text-align: center; }
        .arrow { font-size: clamp(2rem, 4vw, 3rem); color: var(--accent); font-weight: 900; }

        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: clamp(1.2rem, 2.5vw, 2rem); text-align: center; }
        .card-hot { border-top: 3px solid var(--accent); }
        .tag { display: inline-block; font-family: var(--font-mono); font-size: var(--small); padding: 0.2em 0.7em; background: var(--accent-dim); color: var(--accent); border-radius: 6px; font-weight: 800; }

        .reveal { opacity: 0; transform: translateY(28px); transition: opacity 0.7s cubic-bezier(0.16,1,0.3,1), transform 0.7s cubic-bezier(0.16,1,0.3,1); will-change: transform, opacity; }
        .slide.visible .reveal { opacity: 1; transform: translateY(0); will-change: auto; }
        .d1 { transition-delay: 0.06s; } .d2 { transition-delay: 0.14s; } .d3 { transition-delay: 0.22s; } .d4 { transition-delay: 0.30s; }

        .lucide { width: 1em; height: 1em; }
        .icon-xl { font-size: clamp(3rem, 7vw, 5rem); color: var(--accent); }
        .icon-lg { font-size: clamp(1.8rem, 3vw, 2.5rem); color: var(--accent); }
        .icon-md { font-size: clamp(1.4rem, 2.5vw, 1.8rem); color: var(--accent); }
        .icon-circle {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 0.45em; border-radius: 50%; background: var(--accent-dim); color: var(--accent); flex-shrink: 0;
        }

        @media (max-height: 700px) { :root { --title: clamp(2.5rem, 8vw, 5rem); --h2: clamp(2rem, 5.5vw, 3.5rem); --h3: clamp(1.2rem, 2.5vw, 2rem); --body: clamp(1.1rem, 2vw, 1.5rem); --small: clamp(1rem, 1.8vw, 1.3rem); --pad: clamp(1.5rem, 4vw, 3rem); --gap: clamp(0.8rem, 2vw, 1.5rem); } }
        @media (max-height: 600px) { :root { --title: clamp(2rem, 7vw, 3.5rem); --h2: clamp(1.6rem, 4.5vw, 2.5rem); --h3: clamp(1rem, 2vw, 1.5rem); --body: clamp(1rem, 1.8vw, 1.3rem); --small: clamp(0.9rem, 1.5vw, 1.1rem); --pad: clamp(1rem, 3vw, 2rem); --gap: clamp(0.5rem, 1.2vw, 0.8rem); } }
        @media (max-height: 500px) { :root { --title: clamp(1.5rem, 5vw, 2.5rem); --h2: clamp(1.2rem, 3.5vw, 2rem); --h3: clamp(0.9rem, 1.8vw, 1.3rem); --body: clamp(0.85rem, 1.5vw, 1.1rem); --small: clamp(0.8rem, 1.2vw, 1rem); --pad: clamp(0.5rem, 2vw, 1.2rem); --gap: clamp(0.4rem, 1vw, 0.6rem); } }
        @media (max-width: 768px) { .comparison { flex-direction: column; } .arrow { transform: rotate(90deg); } }
        @media (prefers-reduced-motion: reduce) { .reveal { transition: opacity 0.3s ease; transform: none; } }
    </style>
</head>
<body>

    <!-- 1. 타이틀 — 정리 (WRAP UP) -->
    <section class="slide" id="s1" role="region" aria-label="슬라이드 1: 정리">
        <div class="slide-content">
            <p class="label reveal d1">WRAP UP</p>
            <h1 class="mega reveal d2" style="margin-top: 0.3em;">
                <span class="accent">정리</span>
            </h1>
        </div>
    </section>

    <!-- 2. 콜백 — 이미 해왔던 것에 이름이 붙은 것 -->
    <section class="slide" id="s2" role="region" aria-label="슬라이드 2: 이미 해왔던 것에 이름이 붙은 것">
        <div class="slide-content">
            <div class="icon-circle icon-xl reveal d1">
                <i data-lucide="sparkles"></i>
            </div>
            <h2 class="reveal d2" style="margin-top: var(--gap);">
                이미 <span class="accent">해왔던 것</span>에<br>이름이 붙은 것
            </h2>
        </div>
    </section>

    <!-- 3. 비교 — $9 vs $200 -->
    <section class="slide" id="s3" role="region" aria-label="슬라이드 3: 같은 모델, 달라진 건 환경뿐">
        <div class="slide-content">
            <p class="label reveal d1">SAME MODEL</p>
            <div class="comparison reveal d2" style="margin-top: var(--gap);">
                <div>
                    <p class="num-big" style="color: #EF4444;">$9</p>
                    <p class="num-label">망한 앱</p>
                </div>
                <div class="arrow">vs</div>
                <div>
                    <p class="num-big" style="color: #3FB950;">$200</p>
                    <p class="num-label">동작하는 앱</p>
                </div>
            </div>
            <p class="reveal d3 sub" style="margin-top: var(--gap); font-size: var(--h3); font-weight: 700;">
                달라진 건 <span class="accent">환경</span>뿐
            </p>
        </div>
    </section>

    <!-- 4. 반복 키워드 — AI가 잘 일할 수 있는 환경을 만드는 것 -->
    <section class="slide" id="s4" role="region" aria-label="슬라이드 4: AI가 잘 일할 수 있는 환경을 만드는 것">
        <div class="slide-content">
            <div class="icon-circle icon-xl reveal d1">
                <i data-lucide="target"></i>
            </div>
            <h2 class="reveal d2" style="margin-top: var(--gap);">
                AI가 잘 일할 수 있는<br><span class="accent">환경</span>을 만드는 것
            </h2>
        </div>
    </section>

    <!-- 5. 강조 — AI 탓하지 마세요, 환경을 바꾸세요 -->
    <section class="slide" id="s5" role="region" aria-label="슬라이드 5: AI 탓하지 마세요 환경을 바꾸세요">
        <div class="slide-content">
            <div class="icon-xl reveal d1" style="color: #3FB950;">
                <i data-lucide="circle-check"></i>
            </div>
            <h2 class="reveal d2" style="margin-top: var(--gap);">
                AI 탓하지 <span class="accent">마세요</span>
            </h2>
            <p class="reveal d3 sub" style="margin-top: 0.5em; font-size: var(--h3); font-weight: 500;">
                <span class="accent">환경</span>을 바꾸세요
            </p>
        </div>
    </section>

    <!-- 6. 강의 안내 -->
    <section class="slide" id="s6" role="region" aria-label="슬라이드 6: 강의 안내">
        <div class="slide-content">
            <div class="icon-circle icon-xl reveal d1">
                <i data-lucide="graduation-cap"></i>
            </div>
            <h2 class="reveal d2" style="margin-top: var(--gap);">
                실습으로 <span class="accent">따라해보기</span>
            </h2>
            <p class="reveal d3 sub" style="margin-top: 0.5em; font-size: var(--h3); font-weight: 500;">
                gymcoding.co/vip
            </p>
        </div>
    </section>

    <!-- 7. 구독과 좋아요 -->
    <section class="slide" id="s7" role="region" aria-label="슬라이드 7: 구독과 좋아요 부탁드려요">
        <div class="slide-content">
            <p class="label reveal d1">THANK YOU</p>
            <h1 class="mega reveal d2" style="margin-top: 0.3em;">
                구독과 <span class="accent">좋아요</span><br>부탁드려요
            </h1>
        </div>
    </section>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>lucide.createIcons();</script>
    <script>
        const slides = document.querySelectorAll('.slide');
        const obs = new IntersectionObserver(entries => { entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); }); }, { threshold: 0.35 });
        slides.forEach(s => obs.observe(s));
        if (slides[0]) slides[0].classList.add('visible');
        let cur = 0, busy = false, touchY = 0;
        const go = i => { if (i < 0 || i >= slides.length || busy) return; busy = true; cur = i; slides[i].scrollIntoView({ behavior: 'smooth' }); setTimeout(() => busy = false, 600); };
        document.addEventListener('keydown', e => {
            if (e.key === 'f' || e.key === 'F') { if (!document.fullscreenElement) { document.documentElement.requestFullscreen(); } else { document.exitFullscreen(); } return; }
            if (['ArrowDown','ArrowRight',' ','PageDown'].includes(e.key)) { e.preventDefault(); go(cur+1); } else if (['ArrowUp','ArrowLeft','PageUp'].includes(e.key)) { e.preventDefault(); go(cur-1); }
        });
        document.addEventListener('touchstart', e => { touchY = e.touches[0].clientY; }, { passive: true });
        document.addEventListener('touchend', e => { const d = touchY - e.changedTouches[0].clientY; if (Math.abs(d) > 50) go(d > 0 ? cur+1 : cur-1); }, { passive: true });
        let lastW = 0; document.addEventListener('wheel', e => { const n = Date.now(); if (n - lastW < 800) return; lastW = n; go(e.deltaY > 0 ? cur+1 : cur-1); }, { passive: true });
    </script>
</body>
</html>
